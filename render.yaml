services:
  - type: web
    name: yob-invitational
    runtime: node
    # A paid instance (starter+) is required for the persistent disk below.
    # Without the disk, the JSON data store resets on every deploy/restart.
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: INVITE_CODE
        value: yob2026
      - key: DATA_DIR
        value: /var/data
      - key: LOG_LEVEL
        value: info
    disk:
      name: yob-data
      mountPath: /var/data
      sizeGB: 1
