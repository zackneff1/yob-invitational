databases:
  - name: yob-db
    databaseName: yob_invitational
    user: yob
    plan: basic-256mb # plenty for a 12-player event; daily backups included

services:
  - type: web
    name: yob-invitational
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    # `npm start` runs `prisma migrate deploy` before booting the server.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: INVITE_CODE
        value: yob2026
      - key: DATABASE_URL
        fromDatabase:
          name: yob-db
          property: connectionString
      - key: LOG_LEVEL
        value: info
